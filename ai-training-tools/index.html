<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 연수 활용 사이트 한눈에 보기</title>
<style>
:root {
  --bg:#f5f9ff; --panel:#ffffff; --text:#122247; --sub:#6b7a99;
  --line:#e7eef8; --blue:#2f7df6; --shadow:0 10px 30px rgba(35,74,130,.08);
}
* { box-sizing:border-box; }
body { margin:0; font-family:Arial, "Noto Sans KR", sans-serif; background:var(--bg); color:var(--text); }
.app { min-height:100vh; display:grid; grid-template-columns:88px 1fr; }
.sidebar { background:#fff; border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:18px 0; gap:18px; }
.logo { width:52px; height:52px; border-radius:16px; display:grid; place-items:center; background:linear-gradient(135deg,#2f7df6,#6c8cff); color:#fff; font-size:24px; box-shadow:var(--shadow); }
.sidebtn { width:44px; height:44px; border-radius:14px; border:none; background:transparent; font-size:20px; color:#5f7398; cursor:pointer; }
.sidebtn.active, .sidebtn:hover { background:#edf5ff; color:var(--blue); }
.main { padding:24px 28px; }
.header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:20px; }
.header h1 { margin:0; font-size:34px; letter-spacing:-1px; }
.header p { margin:7px 0 0; color:var(--sub); }
.search { width:min(420px,40vw); background:#fff; border:1px solid var(--line); border-radius:18px; padding:13px 16px; display:flex; gap:10px; box-shadow:var(--shadow); }
.search input { width:100%; border:0; outline:0; font-size:14px; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px; }
.stat { background:#fff; border:1px solid var(--line); border-radius:22px; padding:18px 20px; box-shadow:var(--shadow); }
.stat small { color:var(--sub); } .stat strong { display:block; margin-top:4px; font-size:30px; }
.content { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(360px,.85fr); gap:18px; align-items:start; }
.catalog, .detail { background:#fff; border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow); }
.catalog { padding:20px; }
.section-title { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
.section-title h2 { margin:0; font-size:22px; }
.filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.filter { border:1px solid var(--line); background:#f8fbff; color:#5c6f91; padding:8px 12px; border-radius:999px; cursor:pointer; font-size:13px; }
.filter.active { background:#e8f2ff; color:#1768e5; border-color:#bcd7ff; font-weight:700; }
.groups { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.group { border:1px solid var(--line); border-radius:18px; padding:14px; background:#fbfdff; }
.group h3 { margin:0 0 12px; font-size:15px; }
.cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
.tool { background:#fff; border:1px solid var(--line); border-radius:14px; padding:11px; cursor:pointer; transition:.18s ease; min-height:84px; }
.tool:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(35,74,130,.08); }
.tool.active { border-color:#4b91f7; box-shadow:0 0 0 2px #dcecff inset; }
.tool .icon { width:34px;height:34px;border-radius:10px;background:#edf4ff;color:#2f7df6;display:grid;place-items:center;font-weight:800;margin-bottom:8px; }
.tool b { font-size:14px; } .tool span { display:block;color:var(--sub);font-size:11px;margin-top:4px;line-height:1.4; }
.detail { position:sticky; top:18px; padding:22px; }
.detail-top { display:flex; gap:14px; align-items:center; margin-bottom:16px; }
.bigicon { width:64px;height:64px;border-radius:18px;background:#edf4ff;color:#2f7df6;display:grid;place-items:center;font-size:24px;font-weight:800; }
.detail h2 { margin:0; font-size:28px; } .badge { display:inline-block; margin-top:6px; color:#5680b9; font-size:13px; }
.summary { color:#51627f; line-height:1.7; padding-bottom:16px; border-bottom:1px solid var(--line); }
.block { padding:14px 0; border-bottom:1px solid var(--line); }
.block h4 { margin:0 0 9px; font-size:15px; }
.chips { display:flex; flex-wrap:wrap; gap:7px; }
.chip { background:#f2f6fb; border:1px solid #e7edf5; color:#50617d; padding:7px 9px; border-radius:10px; font-size:12px; }
.open { margin-top:16px; display:inline-block; background:var(--blue); color:#fff; text-decoration:none; padding:12px 16px; border-radius:12px; font-weight:700; }
.empty { padding:36px; color:var(--sub); text-align:center; grid-column:1/-1; }
@media (max-width:1100px) {
  .content { grid-template-columns:1fr; }
  .detail { position:relative; top:0; }
  .groups { grid-template-columns:repeat(2,1fr); }
}
@media (max-width:760px) {
  .app { grid-template-columns:1fr; }
  .sidebar { display:none; }
  .main { padding:16px; }
  .header { align-items:flex-start; flex-direction:column; }
  .search { width:100%; }
  .stats { grid-template-columns:1fr; }
  .groups { grid-template-columns:1fr; }
  .cards { grid-template-columns:1fr 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">✦</div>
    <button class="sidebtn active">⌂</button>
    <button class="sidebtn">⌕</button>
    <button class="sidebtn">▦</button>
    <button class="sidebtn">♡</button>
    <button class="sidebtn">☷</button>
    <button class="sidebtn">⚙</button>
  </aside>

  <main class="main">
    <header class="header">
      <div>
        <h1>AI 연수 활용 사이트 한눈에 보기</h1>
        <p>사이트 · 프로그램 · AI 시스템 분류 및 활용 분야</p>
      </div>
      <div class="search">⌕ <input id="searchInput" placeholder="프로그램 또는 기능 검색..." /></div>
    </header>

    <section class="stats">
      <div class="stat"><small>총 프로그램</small><strong id="countTools">20개</strong></div>
      <div class="stat"><small>주요 카테고리</small><strong id="countCats">9개</strong></div>
      <div class="stat"><small>활용 방식</small><strong>클릭형</strong></div>
    </section>

    <section class="content">
      <div class="catalog">
        <div class="section-title">
          <h2>AI 프로그램 목록</h2>
          <span style="color:#7c8ba5;font-size:13px">프로그램을 클릭하면 오른쪽에 상세 설명이 나타납니다.</span>
        </div>
        <div class="filters" id="filters"></div>
        <div class="groups" id="groups"></div>
      </div>

      <aside class="detail" id="detail"></aside>
    </section>
  </main>
</div>

let selected = DATA[0].name;
let currentCategory = "전체";
const categoryColors = {"범용 AI":"#2f7df6","AI 에이전트":"#ff8b38","웹·앱 제작":"#ef5f88","디자인·UI":"#8e63f7","개발·코드":"#2ebc78","데이터·백엔드":"#f0b122","배포·호스팅":"#22b8c7","AI API·모델":"#6379f5","SNS·자동화":"#e05db3"};
function renderFilters(){const cats=["전체",...new Set(DATA.map(x=>x.category))];document.getElementById("filters").innerHTML=cats.map(c=>`<button class="filter ${c===currentCategory?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join("");document.getElementById("countCats").textContent=(cats.length-1)+"개";}
function setCategory(c){currentCategory=c;renderFilters();renderGroups();}
function renderGroups(){const q=document.getElementById("searchInput").value.trim().toLowerCase();let rows=DATA.filter(x=>currentCategory==="전체"||x.category===currentCategory);if(q){rows=rows.filter(x=>[x.name,x.category,x.summary,...x.features,...x.strengths,...x.useCases,...x.similar].join(" ").toLowerCase().includes(q));}document.getElementById("countTools").textContent=rows.length+"개";const cats=[...new Set(rows.map(x=>x.category))];if(!rows.length){document.getElementById("groups").innerHTML=`<div class="empty">검색 결과가 없습니다.</div>`;return;}document.getElementById("groups").innerHTML=cats.map(cat=>{const list=rows.filter(x=>x.category===cat);return `<div class="group"><h3><span style="color:${categoryColors[cat]||'#2f7df6'}">●</span> ${cat}</h3><div class="cards">${list.map(t=>`<div class="tool ${t.name===selected?'active':''}" onclick="selectTool('${t.name.replaceAll("'","\\'")}')"><div class="icon">${t.icon}</div><b>${t.name}</b><span>${t.summary.slice(0,44)}${t.summary.length>44?'…':''}</span></div>`).join("")}</div></div>`;}).join("");}
function chips(items){return `<div class="chips">${items.map(x=>`<span class="chip">${x}</span>`).join("")}</div>`;}
function renderDetail(){const t=DATA.find(x=>x.name===selected)||DATA[0];document.getElementById("detail").innerHTML=`<div class="detail-top"><div class="bigicon">${t.icon}</div><div><h2>${t.name}</h2><span class="badge">${t.category}</span></div></div><div class="summary">${t.summary}</div><div class="block"><h4>주요 기능</h4>${chips(t.features)}</div><div class="block"><h4>강점</h4>${chips(t.strengths)}</div><div class="block"><h4>주요 활용</h4>${chips(t.useCases)}</div><div class="block"><h4>비슷한 서비스</h4>${chips(t.similar)}</div><a class="open" href="${t.url}" target="_blank" rel="noopener">사이트 열기 ↗</a>`;}
function selectTool(name){selected=name;renderGroups();renderDetail();}
document.getElementById("searchInput").addEventListener("input",renderGroups);renderFilters();renderGroups();renderDetail();
</script>
